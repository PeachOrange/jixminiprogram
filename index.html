<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="极X星球回收店主经营体系小程序交互原型">
  <title>极X星球｜回收店主小程序原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="prototype-app" id="prototype-app">
    <header class="prototype-header">
      <a class="brand" href="#" aria-label="极X星球前台原型首页">
        <span class="brand-mark">X</span>
        <span><strong>极X星球</strong><small>回收店主经营 · 小程序原型</small></span>
      </a>
      <div class="header-note"><span class="live-dot"></span>交互演示模式</div>
      <button class="scenario-toggle" id="scenario-toggle" type="button" aria-controls="scenario-controls" aria-expanded="false">情景设置</button>
    </header>

    <main class="prototype-stage">
      <section class="device-wrap" aria-label="小程序手机界面">
        <div class="device">
          <div class="device-speaker" aria-hidden="true"></div>
          <div class="status-bar"><span>9:41</span><strong>极X星球</strong><span>•••</span></div>
          <header class="app-header" id="app-header"></header>
          <div class="page-content" id="page-content" aria-live="polite"></div>
          <div class="phone-authorization-panel" id="phone-authorization-panel" hidden></div>
          <nav class="bottom-nav" data-bottom-nav aria-label="小程序主导航">
            <button type="button" data-root="home"><i>星</i><span>首页</span></button>
            <button type="button" data-root="promotion"><i>推</i><span>推广</span></button>
            <button type="button" data-root="orders"><i>单</i><span>订单</span></button>
            <button type="button" data-root="mine" class="active"><i>我</i><span>我的</span></button>
          </nav>
        </div>
      </section>

      <aside class="scenario-panel" id="scenario-controls" aria-label="原型情景设置">
        <div class="scenario-heading">
          <div><span class="section-label">原型控制台</span><h1>切换用户情景</h1></div>
          <span class="version-tag">前台 P0</span>
        </div>
        <p class="scenario-intro">切换普通用户与店主情景，查看登记、经营、成长和分享链路。</p>

        <div class="control-group">
          <label for="role-select">用户身份</label>
          <select id="role-select">
            <option value="owner" selected>回收店主</option>
            <option value="user">普通用户</option>
          </select>
        </div>
        <div class="control-group">
          <label for="level-select">店主等级</label>
          <select id="level-select">
            <option value="2">LV2 · 成长店主</option>
            <option value="4" selected>LV4 · 轻享店主</option>
            <option value="8">LV8 · 星享店主</option>
            <option value="11">LV11 · 超级店主</option>
            <option value="12">LV12 · 超级合伙人</option>
          </select>
        </div>
        <div class="control-group">
          <label for="status-select">店主状态</label>
          <select id="status-select">
            <option>正常</option><option>预警</option><option>休眠</option><option>限权</option><option>冻结</option><option>终止</option><option>已退出</option>
          </select>
        </div>
        <div class="control-group">
          <label for="content-state-select">内容状态</label>
          <select id="content-state-select">
            <option value="normal" selected>正常</option>
            <option value="empty">空列表</option>
            <option value="load-error">加载失败</option>
            <option value="network-error">网络异常</option>
            <option value="unavailable">内容已下架</option>
          </select>
        </div>

        <div class="quick-scenarios">
          <span>快捷情景</span>
          <button type="button" data-scenario="ordinary">普通用户</button>
          <button type="button" data-scenario="dormant">休眠店主</button>
          <button type="button" data-scenario="partner">LV12达标</button>
        </div>

        <button class="primary-action" id="show-upgrade" type="button">模拟升级成功</button>

        <div class="interaction-guide">
          <h2>可点击区域</h2>
          <ul>
            <li>普通用户开店登记与运营微信码</li>
            <li>统一钱包与我的回收店入口</li>
            <li>等级权益卡片横向滑动与定位</li>
            <li>团队订单、钱包流水与素材分类筛选</li>
            <li>底部导航和各二级页面返回</li>
            <li>专属分享、复制、保存、播放与提现反馈</li>
          </ul>
        </div>
      </aside>
    </main>

    <div class="modal-backdrop" id="upgrade-modal" hidden>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
